# fnet2d_vscyto2daug_seed1 predict: nucleus trained on ipsc_confocal, tested on the
# iPSC DynaCell-lite test set (50 of 100 FOVs), 2D focus slab only (focus2d.halfwidth=1).
# Phase3D source, so the lite dataset_ref fills data_path and channels. The plane
# file comes from dynacell precompute-gt build.focus_planes on the lite dataset.
# Best val-loss checkpoint: epoch=12-step=2158-loss=1.274.ckpt (loss/validate=1.274),
# baked by tools/bake_best_ckpt.py. The fit ran to step 200000; last.ckpt holds the overfit weights.
base:
  - ../../../_internal/shared/model/predict_sets/ipsc_confocal_lite.yml
  - ../../../_internal/shared/model/targets/nucleus.yml
  - ../../../_internal/shared/model/model_overlays/fnet2d_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: nucleus
  trained_on: ipsc_confocal
  predict_set: ipsc_confocal_lite
  model_name: fnet2d_vscyto2daug_seed1
  experiment_id: nucleus__ipsc_confocal__fnet2d_vscyto2daug_seed1__ipsc_confocal_lite

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/fnet2d_vscyto2daug_seed1/checkpoints/epoch=12-step=2158-loss=1.274.ckpt

data:
  init_args:
    predict_z_planes: /hpc/projects/virtual_staining/training/dynacell_lite/focus2d_planes/nucleus/ipsc__h1.json
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args: {keys: [Phase3D], level: fov_statistics, subtrahend: mean, divisor: std}
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell_lite/nucleus/fnet2d_vscyto2daug_seed1/ipsc/ipsc/prediction.zarr

launcher:
  job_name: FNet2DVSAug_seed1_PRED_NUCL_LITE
  run_root: /hpc/projects/virtual_staining/training/dynacell_lite/nucleus/fnet2d_vscyto2daug_seed1/ipsc/ipsc
