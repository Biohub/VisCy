# fnet2d_vscyto2daug predict: nucleus trained on ipsc_confocal, tested on the
# A549 h2b ZIKV DynaCell-lite test set (12 FOVs x 5 timepoints), 2D focus slab only (focus2d.halfwidth=1).
# Phase3D source, so the lite dataset_ref fills data_path and channels. The plane
# file comes from dynacell precompute-gt build.focus_planes on the lite dataset.
# Best val-loss checkpoint: epoch=22-step=3818-loss=1.219.ckpt (loss/validate=1.219),
# baked by tools/bake_best_ckpt.py. The fit ran to step 200000; last.ckpt holds the overfit weights.
base:
  - ../../../_internal/shared/model/predict_sets/a549_mantis_h2b_zikv_lite.yml
  - ../../../_internal/shared/model/targets/nucleus.yml
  - ../../../_internal/shared/model/model_overlays/fnet2d_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/mode_predict.yml
  - ../../../_internal/shared/model/launcher_profiles/hardware_predict_any_gpu.yml
  - ../../../_internal/shared/model/launcher_profiles/runtime_shared.yml

benchmark:
  task: virtual_staining
  organelle: nucleus
  trained_on: ipsc_confocal
  predict_set: a549_mantis_h2b_zikv_lite
  model_name: fnet2d_vscyto2daug
  experiment_id: nucleus__ipsc_confocal__fnet2d_vscyto2daug__a549_mantis_h2b_zikv_lite
  dataset_ref:
    target: h2b

model:
  init_args:
    ckpt_path: /hpc/projects/comp.micro/virtual_staining/models/dynacell/ipsc/nucleus/fnet2d_vscyto2daug/checkpoints/epoch=22-step=3818-loss=1.219.ckpt

data:
  init_args:
    predict_z_planes: /hpc/projects/virtual_staining/training/dynacell_lite/focus2d_planes/nucleus/a549__zikv__h1.json
    normalizations:
      - class_path: viscy_transforms.NormalizeSampled
        init_args: {keys: [Phase3D], level: fov_statistics, subtrahend: mean, divisor: std}
    augmentations: []

trainer:
  callbacks:
    - class_path: viscy_utils.callbacks.prediction_writer.HCSPredictionWriter
      init_args:
        output_store: /hpc/projects/virtual_staining/training/dynacell_lite/nucleus/fnet2d_vscyto2daug/ipsc/a549__zikv/prediction.zarr

launcher:
  job_name: FNet2DVSAug_PRED_NUCL_LITE_A549zikv
  run_root: /hpc/projects/virtual_staining/training/dynacell_lite/nucleus/fnet2d_vscyto2daug/ipsc/a549__zikv
